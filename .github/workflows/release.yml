name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: samuelba/actions/release-please@563bf7ae6023a9191920575d554f912a7389a888 # v1.1.0
        id: release
        with:
          # A fine-grained PAT lets CI run on the release pull request. Without it, the release still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  docker:
    # A release created with github.token does not trigger other workflows, so the images are built here.
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/dmarc-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Publishes docs/site to samuelba.dev. Needs a write deploy key for
  # samuelba/samuelba-website in WEBSITE_DEPLOY_KEY, and WEBSITE_UPDATE=true.
  # See DEVELOPMENT.md. workflow_dispatch publishes main against the latest release.
  website:
    needs: [release-please, docker]
    if: |
      always() && vars.WEBSITE_UPDATE == 'true' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' && needs.docker.result == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: website-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Resolve the published tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          else
            tag="${{ needs.release-please.outputs.tag_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.release-please.outputs.tag_name }}
          path: dmarc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: samuelba/samuelba-website
          ref: main
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync and build
        run: |
          set -euo pipefail
          node dmarc/scripts/sync-docs.mjs --root dmarc --out site --tag "${{ steps.tag.outputs.tag }}"
          npm ci --prefix site
          npm run build --prefix site

      - name: Push to the website
        working-directory: site
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'the website already has these docs'
            exit 0
          fi
          git add src/content/docs/dmarc-visualizer src/data/dmarc-release.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs(dmarc): update docs to ${{ steps.tag.outputs.tag }}"
          git push origin HEAD:main
