name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Use npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check format
        working-directory: ./backend
        run: npm run format:check

      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Build
        working-directory: ./backend
        run: npm run build

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:cov

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  backend-imap-e2e:
    name: Backend IMAP E2E (GreenMail)
    runs-on: ubuntu-latest
    needs: backend

    # Same services and ports as docker-compose.imap-test.yml
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled
            -Dgreenmail.users=dmarc:secret@test.local
            -Dgreenmail.users.login=email
        ports:
          - 13025:3025
          - 13143:3143
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dmarc_imap_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Use npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      # Builds, then runs test/imap/imap.e2e-spec.ts (waits for GreenMail itself)
      - name: Run IMAP E2E test
        working-directory: ./backend
        run: npm run test:e2e:imap

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check format
        working-directory: ./frontend
        run: npm run format:check

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: frontend

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Run E2E tests
        working-directory: ./frontend
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to validate docs
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null && git diff --name-only "${BASE}" HEAD | grep -Eq '^(docs/site/|examples/|\.env\.sample$|backend/src/|CHANGELOG\.md$|scripts/(check-env-docs|sync-docs|docs-preview)|package\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the docs scripts and check environment coverage
        if: steps.scope.outputs.run == 'true'
        run: |
          node --test scripts/check-env-docs.test.mjs scripts/sync-docs.test.mjs
          node scripts/check-env-docs.mjs

      - name: Validate compose examples
        if: steps.scope.outputs.run == 'true'
        env:
          POSTGRES_PASSWORD: ci-placeholder
          DATABASE_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder
          PUBLIC_HOST: dmarc.example.com
          ACME_EMAIL: admin@example.com
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
        run: |
          set -euo pipefail
          for dir in default traefik caddy cloudflare-tunnel; do
            docker compose --env-file "examples/${dir}/.env.example" -f "examples/${dir}/compose.yml" config -q
          done

      # samuelba-website is private: it needs a read-only deploy key in WEBSITE_READ_KEY.
      # Fork PRs get no secrets, so the site build is skipped there.
      - name: Check for website access
        id: website
        if: steps.scope.outputs.run == 'true'
        env:
          WEBSITE_READ_KEY: ${{ secrets.WEBSITE_READ_KEY }}
        run: |
          if [ -n "${WEBSITE_READ_KEY}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WEBSITE_READ_KEY is not available, skipping the docs site build."
          fi

      # samuelba-website main must already contain the Starlight integration.
      - name: Checkout the website
        if: steps.website.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: samuelba/samuelba-website
          ref: main
          ssh-key: ${{ secrets.WEBSITE_READ_KEY }}
          persist-credentials: false
          path: site

      - name: Build the published docs
        if: steps.website.outputs.build == 'true'
        run: |
          node scripts/sync-docs.mjs --out site
          npm ci --prefix site
          npm run build --prefix site

      - name: Upload the docs site
        if: steps.website.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          retention-days: 7
